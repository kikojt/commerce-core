server:
  port: 8080

spring:
  application:
    name: commerce-core

  datasource:
    url: jdbc:postgresql://localhost:5432/db_commerce
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true